name: Linux native payloads
description: >-
  Builds, or restores from cache, the reviewed native payloads one Linux
  runtime identifier needs before Asura can be built or published: the
  terminal payload, the CEF runtime and the SQL language worker. Shared by
  the pull-request lane and the release gate so both ship the same bits.

inputs:
  rid:
    description: linux-x64 or linux-arm64
    required: true

runs:
  using: composite
  steps:
    - name: Install the native build toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential bzip2 clang cmake file git libx11-dev python3 xz-utils \
          libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libcups2 \
          libxkbcommon0 libxdamage1 libxcomposite1 libxrandr2 libgbm1 \
          libpango-1.0-0 libcairo2 libasound2t64 libxtst6 libdrm2 libxfixes3 \
          libxi6 libxcursor1 libxinerama1 libxext6 libxrender1 libdbus-1-3 \
          libglib2.0-0 libexpat1 libgl1
    - name: Restore verified native payload cache
      id: native-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          native/artifacts/common
          native/artifacts/${{ inputs.rid }}
        key: >-
          native-${{ inputs.rid }}-${{ hashFiles(
            'scripts/build-libghostty-vt.sh',
            'scripts/build-terminal-font-assets.sh',
            'scripts/build-cef-runtime.sh',
            'scripts/build-sql-language-worker.sh',
            'scripts/prepare-locked-maven-repository.py',
            'native/ghostty-vt/**',
            'native/porta-pty/**',
            'native/sql-language-worker/pom.xml',
            'native/sql-language-worker/src/**',
            'native/sql-language-worker/maven-content-lock.json',
            'native/sql-language-worker/generate-third-party-notices.sh',
            'licenses/native-terminal-components.json',
            'licenses/terminal-font-assets.json',
            'licenses/cef-runtime-components.json',
            'vendor/exclr8cef/ASURA-PATCHSET.sha256',
            'vendor/exclr8cef/ASURA-SOURCE-SNAPSHOT.sha256',
            'vendor/exclr8cef/native/**') }}
    # Each payload is rebuilt only when its own output is missing, so a
    # partly restored directory finishes rather than starting over.
    - name: Build verified terminal payload
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [[ ! -f "native/artifacts/${{ inputs.rid }}/libghostty-vt.so" \
            || ! -f "native/artifacts/${{ inputs.rid }}/libasura_pty.so" ]]; then
          ASURA_DOTNET="$(command -v dotnet)" ./scripts/build-libghostty-vt.sh --rid "${{ inputs.rid }}"
        fi
    - name: Build verified CEF runtime
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CC: clang
        CXX: clang++
      run: |
        if [[ ! -f "native/artifacts/${{ inputs.rid }}/cef/libcef.so" \
            || ! -f "native/artifacts/${{ inputs.rid }}/cef/libexclr8cef.so" ]]; then
          ./scripts/build-cef-runtime.sh --rid "${{ inputs.rid }}" --dotnet "$(command -v dotnet)"
        fi
    - name: Build verified SQL language worker
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [[ ! -f "native/artifacts/${{ inputs.rid }}/asura-sql-language" \
            || ! -f "native/artifacts/${{ inputs.rid }}/build-receipt.json" ]]; then
          ./scripts/build-sql-language-worker.sh --docker --rid "${{ inputs.rid }}"
        fi
